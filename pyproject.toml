[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "N999",    # Root directory name follows GitHub repo casing 'trueMoA'
    "B008",    # Function calls in argument defaults
    "B009",    # getattr with constant attribute value (used for dynamic introspection of Hermes seams)
    "E501",    # Line length handled by formatter
    "RUF012",  # Mutable class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841", "BLE001", "S110"]
"selftest.py" = ["E402", "F841", "BLE001", "S110"]
"__init__.py" = ["BLE001", "S110"]
"true_moa/doctor.py" = ["BLE001", "S110"]
"true_moa/gate.py" = ["BLE001", "S110"]
"true_moa/state.py" = ["BLE001", "S110"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
