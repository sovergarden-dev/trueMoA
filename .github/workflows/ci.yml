name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.5 pyyaml==6.0.3 pytest==8.3.4

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run static contract and manifest suite
        run: pytest tests/test_static_contract.py -q -rs
