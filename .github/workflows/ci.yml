name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Validate Plugin Manifest
        run: |
          python -c "
          import yaml
          manifest = yaml.safe_load(open('plugin.yaml', encoding='utf-8'))
          assert manifest['name'] == 'true-moa'
          assert manifest['version'] == '1.2.0'
          assert set(manifest['config_schema'].keys()) == {
              'enabled', 'block_aggregator_fallback', 'max_wait_budget_s',
              'ladder', 'sync_hermes_retries', 'custom_retries'
          }
          print('Manifest validation passed successfully!')
          "
