name: true-moa
label: True MoA
kind: standalone
version: 1.7.1
author: Syrin
homepage: https://syrin.online
description: >
  Strict reliability and smart prefix-cache optimization for Mixture of Agents (MoA):
  retries failed advisors, switches backups with warm-cache stickiness, preserves prefix
  cache across long turns, optionally skips redundant mechanical tool-loop calls, and
  blocks empty answers or solo fallback. Configure in Settings > Plugins > True MoA or `/true-moa`.
requires_hermes: ">=0.23.0"
provides_tools: []
provides_hooks:
  - transform_api_error_classification
provides_commands:
  - true-moa
emits:
  - updated
config_schema:
  language:
    type: string
    default: en
    choices:
      - en
      - vi
    label: "Display Language"
    description: "Language used across True MoA settings, `/true-moa` chat commands, CLI output, health checks, and status notices (`en` = English, `vi` = Vietnamese)."
  enabled:
    type: boolean
    default: true
    label: "Strict MoA Protection"
    description: "Require advisor models to succeed before answering. Failed advisors are retried automatically, broken responses are never cached, and the turn stops safely instead of letting the main model answer alone."
  block_aggregator_fallback:
    type: boolean
    default: true
    label: "Block Main-Model Self-Answering"
    description: "Prevent the main aggregator model from answering in place of a failed advisor when an advisor hits a rate limit or error."
  min_healthy_references:
    type: number
    default: 0
    label: "Minimum Healthy Advisors (Quorum)"
    description: "Set 0 (default) to require every enabled advisor to succeed. Set 1-8 on multi-advisor presets to continue when at least that many advisors respond after all retries finish."
  sync_hermes_retries:
    type: boolean
    default: false
    label: "Sync with Hermes API Retries"
    description: "Automatically match the retry count configured in Hermes (Settings > Advanced > Agent limits > API Retries) with a progressive wait schedule. Overridden when Custom Retry Attempts is greater than 0."
  custom_retries:
    type: number
    default: 0
    label: "Custom Retry Attempts"
    description: "Enter a fixed total attempt count (1-25) to auto-generate a wait schedule. Set 0 (default) to use Sync mode or the manual Retry Schedule list below."
  ladder:
    type: list
    default:
      - 15
      - 30
      - 60
      - 60
      - 60
    label: "Manual Retry Schedule (seconds)"
    description: "Wait times in seconds before each retry when Custom Retry Attempts is 0 and Sync mode is off (default [15, 30, 60, 60, 60] = 6 total attempts)."
  max_wait_budget_s:
    type: number
    default: 0
    label: "Max Retry Sleep Budget (seconds)"
    description: "Cap total wait time spent sleeping between retries. Set 0 (default) to run the full retry schedule; active in-flight advisor requests are never cut off."
  enable_secondary_fallback:
    type: boolean
    default: false
    label: "Backup Advisor Failover"
    description: "Switch failed advisors to a backup advisor model after repeated errors (or immediately on invalid-key / missing-model errors) while keeping strict fail-closed protection."
  secondary_reference_model:
    type: string
    default: ""
    label: "Backup Advisor Model(s)"
    description: "Backup model in `provider:model` format, or a comma-separated failover chain (`p1:m1, p2:m2`). Must differ from the main aggregator model."
  fallback_trigger_attempts:
    type: number
    default: 2
    label: "Switch to Backup After N Failures"
    description: "Number of consecutive failed primary attempts (1-10, default 2) before switching to the backup advisor model."
  fallback_sticky_s:
    type: number
    default: 300
    label: "Keep Backup Warm (seconds)"
    description: "After switching to a backup advisor, keep routing turns directly to that backup for this many seconds (0-3600, default 300; set 0 to disable) so its prompt cache stays warm."
  adaptive_fanout:
    type: boolean
    default: false
    label: "Smart Adaptive Advisor Fan-Out"
    description: "Always consult advisors on every new user turn, then skip redundant mechanical tool-loop steps and refresh immediately on tool failures, context compression, large deltas, or cache keepalive."
  adaptive_max_interval:
    type: number
    default: 5
    label: "Adaptive Max Tool Steps Between Refreshes"
    description: "Maximum consecutive tool iterations before Smart Adaptive Fan-Out forces a fresh advisor check-in (2-20, default 5)."
  adaptive_cache_keepalive_s:
    type: number
    default: 240
    label: "Adaptive Prefix-Cache Keepalive (seconds)"
    description: "Refresh advisors automatically if a long tool loop exceeds this idle gap (0-3600, default 240s to stay inside a 5-minute provider TTL; set 0 to disable)."
  chunked_context_trim:
    type: boolean
    default: true
    label: "Prefix-Safe Chunked Context Trim"
    description: "When a long conversation exceeds an advisor's context window, trim old history in 25% chunks and pin the boundary so the provider prompt cache stays valid across subsequent turns."
  concise_advisory:
    type: boolean
    default: false
    label: "Concise Structured Advisor Output"
    description: "Append a static instruction telling advisors to reply with brief diagnosis, next steps, and risks so output and reasoning token costs drop without breaking prompt prefix caching."
  guard_empty_responses:
    type: boolean
    default: true
    label: "Reject Empty or Refusal Advisor Answers"
    description: "Treat blank HTTP 200 responses, empty sentinels, or bare tool-access refusals from advisors as retryable failures instead of passing empty guidance to the main model."
